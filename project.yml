name: ColorOTD
options:
  bundleIdPrefix: com.ruzai
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ColorOTD:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzai.colorotd
        PRODUCT_NAME: ColorOTD
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Color OTD"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIAppFonts: "Newsreader.ttf Newsreader-Italic.ttf Archivo.ttf SpaceMono-Regular.ttf SpaceMono-Bold.ttf"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  ColorOTDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ColorOTDTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzai.colorotd.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ColorOTD
